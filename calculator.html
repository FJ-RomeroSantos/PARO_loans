
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PARO – Loan Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark" style="background-color: #1F3A5F;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">PARO</a>
            <a class="btn btn-outline-light" href="home.html">Back to Home</a>
        </div>
    </nav>

    <main class="container py-4">

        <h1>Loan Calculator</h1>
        <p class="text-muted mb-4">
            Estimate your monthly payments and total loan cost.
        </p>

        <div class="row g-4">

            <!-- Loan details -->
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">

                        <h2 class="h4 mb-4">Loan Details</h2>

                        <div class="mb-3">
                            <label for="loanType" class="form-label">Loan type</label>
                            <select id="loanType" class="form-select">
                                <option value="">Select a loan type</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label">Loan amount ($)</label>
                            <input type="number" id="amount" class="form-control"
                            placeholder="Enter amount" step="0.01">
                        <div id="amountHelp" class="form-text"></div>
                        </div>

                        <div class="mb-3">
                            <label for="months" class="form-label">Loan term (months)</label>
                            <input type="number" id="months" class="form-control"
                            placeholder="Enter months" step="1">
                        <div id="monthsHelp" class="form-text"></div>
                        </div>

                        <p>
                            Annual interest rate:
                            <strong id="annualRate">--</strong>
                        </p>

                        <p id="errorMessage" class="text-danger"></p>

                    </div>
                </div>
            </div>

            <!-- Loan summary -->
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">

                        <h2 class="h4 mb-4">Loan Summary</h2>

                        <p class="text-muted mb-1">Monthly payment</p>
                        <h3 id="monthlyPayment">$0.00</h3>

                        <hr>

                        <p class="text-muted mb-1">Total payment</p>
                        <h4 id="totalPayment">$0.00</h4>

                        <p class="text-muted mb-1">Total interest</p>
                        <h4 id="totalInterest">$0.00</h4>

                        <button id="requestButton"
                                class="btn btn-primary w-100 mt-3"
                                disabled>
                            Request this loan
                        </button>

                    </div>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Enable authentication when auth.js is available -->
    <!-- <script src="js/auth.js"></script> -->

    <script src="js/calculator.js"></script>

</body>
</html>
