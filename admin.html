<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PARO – Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-paro px-4">
    <span class="navbar-brand fw-bold">PARO</span>
    <div class="d-flex gap-2">
      <a href="home.html" class="btn btn-outline-light btn-sm">Home</a>
      <button id="logout-btn" class="btn btn-light btn-sm">Log out</button>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-1">Admin Panel</h1>
    <p class="text-muted">Review loan applications and approve or reject them.</p>

    <div class="card p-4">
      <div class="btn-group mb-3" role="group" aria-label="Filter by status">
        <button class="btn btn-primary filter-btn" data-filter="all">All</button>
        <button class="btn btn-outline-primary filter-btn" data-filter="pending">Pending</button>
        <button class="btn btn-outline-primary filter-btn" data-filter="approved">Approved</button>
        <button class="btn btn-outline-primary filter-btn" data-filter="rejected">Rejected</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th><th>Date</th><th>Applicant</th><th>Loan type</th>
              <th>Amount</th><th>Months</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="requests-body"></tbody>
        </table>
      </div>

      <div id="empty-message" class="alert alert-info d-none mb-0">
        There are no applications to show.
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
